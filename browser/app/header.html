<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; }
body { display: flex; align-items: center; gap: 10px; padding: 0 10px; box-sizing: border-box; background: #f3f3f3;
       border-bottom: 1px solid #d6d6d6; color: #1a1a1a; font: 13px "Segoe UI", system-ui, sans-serif; user-select: none; }
#status { flex: 1; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
button { font: inherit; padding: 4px 12px; }
</style>
</head>
<body><span id="status"></span><button id="skip" hidden>Skip this file</button></body>
</html>
