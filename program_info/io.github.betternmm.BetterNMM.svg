<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>BetterNMM</title>
  <!-- A "B" made of two mod layers: the upper bowl is laid over the lower one, and where they overlap (the middle bar)
       is the file that wins, the one the game gets. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3448"/>
      <stop offset="1" stop-color="#141821"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe0d2"/>
      <stop offset="1" stop-color="#1fa596"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc35a"/>
      <stop offset="1" stop-color="#ee8418"/>
    </linearGradient>
    <path id="upper" fill-rule="evenodd" d="M65,44 H137 A44,44 0 0 1 137,132 H65 Z M93,68 H135 A20,20 0 0 1 135,108 H93 Z"/>
    <path id="lower" fill-rule="evenodd" d="M65,108 H139 A52,52 0 0 1 139,212 H65 Z M93,132 H137 A28,28 0 0 1 137,188 H93 Z"/>
    <clipPath id="onLower">
      <use href="#lower"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>

  <use href="#lower" fill="url(#amber)"/>
  <!-- the upper layer lies on the lower one -->
  <use href="#upper" fill="#000000" fill-opacity="0.28" transform="translate(0,6)" clip-path="url(#onLower)"/>
  <use href="#upper" fill="url(#teal)"/>
  <!-- where both have a file: the winner -->
  <use href="#upper" fill="#fff6dc" clip-path="url(#onLower)"/>
</svg>
